<section class="intro" aria-labelledby="page-title">
  <div class="brand" aria-label="Improvement Hub">
    <img src="icon.png" alt="" width="44" height="44" />
    <span>{{ 'app.name' | translate }}</span>
  </div>

  <div class="intro-copy">
    <p class="eyebrow">{{ 'intro.eyebrow' | translate }}</p>
    <h1 id="page-title">{{ 'intro.title' | translate }}</h1>
    <p class="summary">{{ 'intro.summary' | translate }}</p>
  </div>

  <div class="promise">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M12 3 5 6v5c0 4.5 2.9 8.6 7 10 4.1-1.4 7-5.5 7-10V6l-7-3Z" />
      <path d="m9 12 2 2 4-4" />
    </svg>
    <div>
      <strong>{{ 'intro.promiseTitle' | translate }}</strong>
      <span>{{ 'intro.promiseText' | translate }}</span>
    </div>
  </div>
</section>
